name: Build the pinned Cognimark HAPI libraries
description: Install the exact source-built HAPI dependencies before building the starter.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: cognimark/hapi-fhir
        ref: de5195d93fdeba10c97c07900ac6ed73d5444099
        path: .cognimark-hapi-core
    - name: Build and test storage contracts
      shell: bash
      working-directory: .cognimark-hapi-core
      env:
        MAVEN_OPTS: -Xmx2g -XX:ActiveProcessorCount=2
      run: |
        mvn -B -ntp -f hapi-fhir-base/pom.xml install
        mvn -B -ntp -f cognimark/narrative-tests/pom.xml test
        mvn -B -ntp -f hapi-fhir-jpaserver-model/pom.xml -Dtest=ResourceTableTest install
        mvn -B -ntp -f hapi-fhir-jpaserver-searchparam/pom.xml install
        mvn -B -ntp -f hapi-fhir-storage/pom.xml -Dtest=BaseStorageDaoResourceIdTest,DaoResourceLinkResolverTest install
        mvn -B -ntp -f hapi-fhir-jpa/pom.xml install
        mvn -B -ntp -f hapi-fhir-storage-batch2/pom.xml install
        mvn -B -ntp -f cognimark/batch2-tests/pom.xml test
        mvn -B -ntp -f hapi-fhir-storage-batch2-jobs/pom.xml install
        mvn -B -ntp -f hapi-fhir-jpaserver-base/pom.xml \
          -Dtest=LocalBatch2WorkRecoveryTest,ReindexPartitionContextTest,JpaJobPersistenceImplTest,ReindexReferencePrefetchTest,SearchBuilderTest,SearchQueryExecutorsTest install
        mvn -B -ntp -f cognimark/reindex-tests/pom.xml test
