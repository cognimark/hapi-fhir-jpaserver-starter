name: Publish Cognimark HAPI Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: New immutable ECR image tag
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: cognimark-hapi-image-publish
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: core-fhir/hapi

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: deployment
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate immutable image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Invalid ECR image tag"
            exit 1
          fi
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "::error::ECR image tag already exists: $IMAGE_TAG"
            exit 1
          fi

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: default
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
          provenance: mode=max

      - name: Report image digest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          digest=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "Published $ECR_REPOSITORY:$IMAGE_TAG@$digest" >> "$GITHUB_STEP_SUMMARY"
