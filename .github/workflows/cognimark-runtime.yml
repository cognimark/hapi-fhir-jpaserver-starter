name: Cognimark runtime compatibility

on:
  push:
    branches: [cognimark/8.12.1-long-resource-ids]
  pull_request:
    branches: [cognimark/8.12.1-long-resource-ids]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: docker.io/library/maven:3.9.12-eclipse-temurin-17@sha256:a0603aab698040d9c94259f379ec0487da1678560748d6c7508483034033c53d
    steps:
      - uses: actions/checkout@v4
      - name: Verify the same toolchain used by the production image build
        run: mvn --version
      - uses: ./.github/actions/cognimark-storage
      - name: Verify the application dependency contract and package the WAR
        env:
          # Bound compression parallelism on high-core hosted runners while
          # leaving enough heap for the complete HAPI dependency overlay.
          MAVEN_OPTS: -Xmx4g -XX:ActiveProcessorCount=2
        run: mvn -B -ntp -Dtest=CognimarkStorageContractTest,CognimarkNarrativeConfigurationTest,LocalBatch2RecoveryConfigurationTest -DskipITs -Pboot package
