name: Smoke Tests

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - "charts/**"
  pull_request:
    branches: [ master ]
    paths-ignore:
      - "charts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_smoke_test:

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Install the Maven version used by the production image build
        run: |
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.12/apache-maven-3.9.12-bin.tar.gz \
            --output "$RUNNER_TEMP/apache-maven.tar.gz"
          printf '%s  %s\n' \
            '0a1be79f02466533fc1a80abbef8796e4f737c46c6574ede5658b110899942a94db634477dfd3745501c80aef9aac0d4f841d38574373f7e2d24cce89d694f70' \
            "$RUNNER_TEMP/apache-maven.tar.gz" | sha512sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/apache-maven.tar.gz" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.12/bin" >> "$GITHUB_PATH"

      - name: Verify the build toolchain
        run: mvn --version

      - name: Build pinned Cognimark storage dependencies
        if: github.repository == 'cognimark/hapi-fhir-jpaserver-starter'
        uses: ./.github/actions/cognimark-storage

      - name: Build with Maven
        env:
          MAVEN_OPTS: -Xms256m -Xmx3g -XX:+UseG1GC
        run: mvn -B -ntp -Pjetty package --file pom.xml -Dmaven.test.skip=true

      - name: Docker Pull HTTP client
        run: docker pull jetbrains/intellij-http-client

      - name: Start server with jetty
        run: |
          mkdir -p logs
          mvn -B -ntp -Pjetty spring-boot:run > logs/server.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 5 http://localhost:8080/fhir/metadata > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat logs/server.log
              exit 1
            fi
            sleep 2
          done
          echo "FHIR server did not become ready"
          exit 1

      - name: Execute smoke tests
        run: docker run --rm --network host -v "$PWD:/workdir" jetbrains/intellij-http-client -D src/test/smoketest/plain_server.http --env-file src/test/smoketest/http-client.env.json --env default

      - name: Show last server logs
        if: always()
        run: |
          echo "===== Last 200 Lines of Server Log ====="
          tail -n 200 logs/server.log || true    

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: logs/server.log
