AWSTemplateFormatVersion: "2010-09-09"
Description: Cognimark Core FHIR image repository and GitHub publishing identity

Resources:
  FhirImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: core/fhir
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"Keep the five most recent Core FHIR images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}
      Tags:
        - Key: cognimark:system
          Value: core
        - Key: cognimark:component
          Value: fhir
        - Key: cognimark:environment
          Value: production
        - Key: cognimark:managed-by
          Value: cloudformation
        - Key: cognimark:repository
          Value: cognimark/hapi-fhir-jpaserver-starter
        - Key: cognimark:data-classification
          Value: internal

  GitHubImagePublishRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-core-fhir-publish
      MaxSessionDuration: 3600
      Tags:
        - Key: cognimark:system
          Value: core
        - Key: cognimark:component
          Value: ci
        - Key: cognimark:environment
          Value: production
        - Key: cognimark:managed-by
          Value: cloudformation
        - Key: cognimark:repository
          Value: cognimark/hapi-fhir-jpaserver-starter
        - Key: cognimark:data-classification
          Value: internal
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:cognimark@179527222/hapi-fhir-jpaserver-starter@1301919009:environment:main
      Policies:
        - PolicyName: PublishCoreFhirImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:TagResource
                  - ecr:UploadLayerPart
                Resource: !GetAtt FhirImageRepository.Arn

Outputs:
  RepositoryUri:
    Description: Canonical Core FHIR image repository URI
    Value: !GetAtt FhirImageRepository.RepositoryUri
  RoleArn:
    Description: GitHub OIDC image publishing role ARN
    Value: !GetAtt GitHubImagePublishRole.Arn
